name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, e.g. v1.1.0. Leave blank to build only."
        required: false
        default: ""

jobs:
  build:
    # WPF/net8.0-windows can only be *built* on Windows, regardless of
    # which OS the published EXE targets.
    runs-on: windows-latest

    # softprops/action-gh-release attaches the EXEs to the tag's Release
    # via the REST API, which the default GITHUB_TOKEN can't do under a
    # repo/org read-only default — it needs contents: write explicitly, or
    # every tag push publishes an asset-less Release ("Resource not
    # accessible by integration").
    permissions:
      contents: write
      # Deleting old build artifacts, see "Prune old build artifacts".
      actions: write

    steps:
      - uses: actions/checkout@v4

      # The exe reports this in Settings and in the Markdown "tool:" field, so
      # it has to be the tag it was cut from. Blank on a plain main-branch
      # push, where the csproj's own <Version> stands instead.
      - name: Work out the version to stamp
        id: version
        shell: pwsh
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          # A tag push, or the manual route with a version typed in. Anything
          # else builds unstamped.
          $raw = ""
          if ($env:MANUAL_VERSION) { $raw = $env:MANUAL_VERSION }
          elseif ($env:GITHUB_REF -like "refs/tags/v*") { $raw = $env:GITHUB_REF_NAME }

          # MSBuild wants 1.3.0; the tag is v1.3.0. Anything that is not three
          # numbers is ignored rather than passed on to the compiler.
          $version = $raw -replace "^v", ""
          if ($version -notmatch "^\d+\.\d+\.\d+$") { $version = "" }

          $stamp = ""
          if ($version) { $stamp = "-p:Version=$version" }
          "stamp=$stamp" >> $env:GITHUB_OUTPUT
          Write-Host "Version stamp: '$stamp'"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Two editions from the same tree — see CLAUDE.md "Editions". Lite is
      # built first and is the cheap one: if a change broke the build itself
      # rather than the speech-recognition packaging, it fails here in a
      # minute instead of after downloading the CUDA runtime.
      - name: Publish Lite EXE (no speech recognition)
        run: >
          dotnet publish src/MeetingRecorder/MeetingRecorder.csproj
          -c Release -r win-x64 --self-contained true
          -p:Edition=Lite
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          ${{ steps.version.outputs.stamp }}
          -o publish/lite

      # AssemblyName is VoxMark in both editions, so the two builds share a
      # crash-log name and a Markdown "tool:" field; only the shipped file
      # name distinguishes them.
      - name: Name the Lite EXE
        shell: pwsh
        run: Rename-Item publish/lite/VoxMark.exe VoxMark-Lite.exe

      - name: Publish Full EXE (whisper.cpp + CUDA)
        run: >
          dotnet publish src/MeetingRecorder/MeetingRecorder.csproj
          -c Release -r win-x64 --self-contained true
          -p:Edition=Full
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          ${{ steps.version.outputs.stamp }}
          -o publish/full

      # Neither EXE is allowed to ship a loose DLL beside it — that is the
      # whole packaging requirement, and the CUDA runtime is exactly the kind
      # of dependency that would quietly break it.
      - name: Check both EXEs are genuinely single files
        shell: pwsh
        run: |
          $failed = $false
          foreach ($edition in @("lite", "full")) {
              # .pdb is the separate symbol file every Release publish emits;
              # it is not shipped and not needed to run the app.
              $stray = Get-ChildItem "publish/$edition" -Recurse -File |
                       Where-Object { $_.Extension -notin ".exe", ".pdb" }
              if ($stray) {
                  Write-Host "::error::$edition publish is not a single file:"
                  $stray | ForEach-Object { Write-Host "  $($_.FullName)" }
                  $failed = $true
              }
          }
          Get-ChildItem publish -Recurse -Filter *.exe |
              ForEach-Object { "{0}  {1:N0} MB" -f $_.Name, ($_.Length / 1MB) }
          if ($failed) { exit 1 }

      # The manifest sets the process's ANSI code page to UTF-8, without
      # which a whisper model under a Hangul path (a Korean user name,
      # OneDrive's "문서") crashes the speech engine. It rides in the
      # single-file host's resources, so check it actually got there rather
      # than trusting the property. The host sits at the front of the file.
      - name: Check both EXEs carry the UTF-8 manifest
        shell: pwsh
        run: |
          $failed = $false
          foreach ($exe in Get-ChildItem publish -Recurse -Filter *.exe) {
              $stream = [System.IO.File]::OpenRead($exe.FullName)
              try {
                  $head = New-Object byte[] ([Math]::Min($stream.Length, 64MB))
                  [void]$stream.Read($head, 0, $head.Length)
              } finally { $stream.Dispose() }
              $text = [System.Text.Encoding]::ASCII.GetString($head)
              if ($text -notmatch "<activeCodePage[^>]*>UTF-8</activeCodePage>") {
                  Write-Host "::error::$($exe.Name) is missing the UTF-8 activeCodePage manifest"
                  $failed = $true
              }
          }
          if ($failed) { exit 1 }

      # Actions artifact storage is a quota, and two exes are ~390 MB a run,
      # so keep only the newest artifact and delete the rest before uploading
      # this run's. Not on pull requests: that token may not hold actions:
      # write, and a PR build has no business deleting main's copies. GitHub
      # recalculates the quota every 6-12 hours, so the space shows as free
      # only after that.
      - name: Prune old build artifacts
        if: github.event_name != 'pull_request'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $all = @()
          $page = 1
          do {
              $batch = (gh api "repos/$repo/actions/artifacts?per_page=100&page=$page" | ConvertFrom-Json).artifacts
              $all += $batch
              $page++
          } while ($batch.Count -eq 100)
          $stale = $all | Where-Object { -not $_.expired } |
                   Sort-Object { [datetime]$_.created_at } -Descending |
                   Select-Object -Skip 1
          foreach ($artifact in $stale) {
              gh api -X DELETE "repos/$repo/actions/artifacts/$($artifact.id)" | Out-Null
              Write-Host "Deleted artifact $($artifact.id) from $($artifact.created_at)"
          }
          Write-Host "Kept the newest artifact; deleted $(@($stale).Count)."

      # A convenience copy of each build, not the distribution channel — the
      # Release below is. Two exes come to ~390 MB a run, which exhausted the
      # account's Actions storage at the default 90-day retention; a full
      # quota must not stop a release, so this step is allowed to fail and
      # keeps its copies for a week only.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: VoxMark-win-x64
          retention-days: 7
          path: |
            publish/full/VoxMark.exe
            publish/lite/VoxMark-Lite.exe

      # Two ways in: pushing a v* tag, or running this workflow by hand with a
      # version. The manual route exists because creating a tag needs push
      # rights a CI-scoped or delegated credential may not have, while this
      # job already holds contents: write — so the action creates the tag
      # itself and there is always a way to cut a release.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.version || github.ref_name }}
          files: |
            publish/full/VoxMark.exe
            publish/lite/VoxMark-Lite.exe

      # Two 150–230 MB EXEs per release adds up fast, and GitHub counts every
      # one of them against the repository forever. The newest release and
      # the one just before it keep their EXEs — the previous build is the
      # way back if the new one misbehaves on a meeting-room PC. Every
      # release older than those two keeps its tag, notes and source
      # archives and loses just the binaries.
      #
      # "Older" is measured against the release this run published, not
      # against "everything else": re-running an old tag's workflow must not
      # strip the assets off a newer release.
      - name: Keep the EXEs on the newest two releases
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $keep = $env:KEEP_TAG
          # No --paginate: it concatenates one JSON array per page, which
          # ConvertFrom-Json will not read as a single document. One page of
          # 100 is every release this repository is ever likely to have.
          $releases = gh api "repos/$repo/releases?per_page=100" | ConvertFrom-Json
          $kept = $releases | Where-Object { $_.tag_name -eq $keep } | Select-Object -First 1
          if (-not $kept) {
              Write-Host "::warning::Could not find the release for $keep; leaving every asset alone."
              exit 0
          }

          function Published($release) {
              if ($release.published_at) { return [datetime]$release.published_at }
              return [datetime]$release.created_at
          }

          $cutoff = Published $kept
          $freed = 0
          $failed = 0

          # Releases older than the one just published, newest first. The
          # first of them is the previous release and keeps its binaries.
          $older = @($releases |
              Where-Object { $_.tag_name -ne $keep -and -not $_.draft -and (Published $_) -lt $cutoff } |
              Sort-Object { Published $_ } -Descending)
          if ($older.Count -gt 0) { Write-Host "$($older[0].tag_name): kept as the previous release" }

          foreach ($release in ($older | Select-Object -Skip 1)) {

              $binaries = @($release.assets | Where-Object { $_.name -like "*.exe" })
              if ($binaries.Count -eq 0) { continue }

              foreach ($asset in $binaries) {
                  $mb = [math]::Round($asset.size / 1MB)
                  Write-Host "$($release.tag_name): removing $($asset.name) ($mb MB)"
                  gh api -X DELETE "repos/$repo/releases/assets/$($asset.id)" | Out-Null
                  if ($LASTEXITCODE -ne 0) { $failed++ } else { $freed += $asset.size }
                  $global:LASTEXITCODE = 0
              }

              # Say so on the release itself, so a visitor who lands on an old
              # version finds an explanation rather than an empty file list.
              $note = "_Binaries for this version were removed to keep the repository's release storage bounded. The two most recent releases always carry both EXEs._"
              if ($release.body -notlike "*release storage bounded*") {
                  $body = ($release.body + "`n`n" + $note).TrimStart("`n")
                  gh api -X PATCH "repos/$repo/releases/$($release.id)" -f body="$body" | Out-Null
                  $global:LASTEXITCODE = 0
              }
          }

          Write-Host ("Freed {0:N0} MB from older releases." -f ($freed / 1MB))
          if ($failed -gt 0) { Write-Host "::warning::$failed asset(s) could not be deleted." }
